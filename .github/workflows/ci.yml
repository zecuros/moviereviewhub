name: CI

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install SonarQube scanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restore dependencies
        run: dotnet restore

      - name: Begin SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet sonarscanner begin
          /k:"zecuros_moviereviewhub"
          /o:"zecuros"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml"

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Generate ephemeral demo credentials
        shell: bash
        run: |
          jwt=$(openssl rand -hex 48)
          grafana=$(openssl rand -hex 24)
          echo "::add-mask::$jwt"
          echo "::add-mask::$grafana"
          echo "JWT_KEY=$jwt" >> "$GITHUB_ENV"
          echo "GRAFANA_ADMIN_PASSWORD=$grafana" >> "$GITHUB_ENV"

      - name: Start application
        run: docker compose up -d --build

      - name: Wait for API Gateway
        run: |
          echo "Waiting for API Gateway..."
          for i in {1..30}; do
            if curl --fail http://localhost:5000/movies; then
              echo "API Gateway is ready."
              exit 0
            fi
            echo "Waiting..."
            sleep 5
          done

          echo "API Gateway did not become ready."
          docker compose ps
          docker compose logs
          exit 1

      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --settings coverage.runsettings --results-directory TestResults

      - name: Check coverage reports exist
        shell: bash
        run: |
          report=$(find TestResults -name coverage.opencover.xml -print -quit)
          test -n "$report" || { echo "No OpenCover report was generated"; exit 1; }

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-opencover
          path: TestResults/**/coverage.opencover.xml
          if-no-files-found: error

      - name: End SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet sonarscanner end
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Verify observability
        shell: pwsh
        run: ./scripts/Verify-Observability.ps1

      - name: Publish AuthService
        run: dotnet publish services/AuthService/AuthService.csproj -c Release -o artifacts/AuthService

      - name: Publish MovieService
        run: dotnet publish services/MovieService/MovieService.csproj -c Release -o artifacts/MovieService

      - name: Publish ReviewService
        run: dotnet publish services/ReviewService/ReviewService.csproj -c Release -o artifacts/ReviewService

      - name: Publish WatchlistService
        run: dotnet publish services/WatchlistService/WatchlistService.csproj -c Release -o artifacts/WatchlistService

      - name: Publish NotificationService
        run: dotnet publish services/NotificationService/NotificationService.csproj -c Release -o artifacts/NotificationService

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moviereviewhub-services
          path: artifacts/

      - name: Stop application
        if: always()
        run: docker compose down -v

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate ephemeral demo credentials
        shell: bash
        run: |
          jwt=$(openssl rand -hex 48)
          grafana=$(openssl rand -hex 24)
          echo "::add-mask::$jwt"
          echo "::add-mask::$grafana"
          echo "JWT_KEY=$jwt" >> "$GITHUB_ENV"
          echo "GRAFANA_ADMIN_PASSWORD=$grafana" >> "$GITHUB_ENV"

      - name: Build Docker images
        run: docker compose build
